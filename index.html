<body>

  <div id="app"></div>

  <!-- Libs -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

  <!-- DEV NAV -->
  <script>
    (function () {
      var h = location.hostname;
      var isDev = h === 'localhost' || h === '127.0.0.1' ||
                  h.indexOf('webcontainer') !== -1 ||
                  h.indexOf('stackblitz') !== -1 ||
                  h.indexOf('.local') !== -1 ||
                  location.search.indexOf('dev=1') !== -1;
      if (!isDev) return;

      // ── Mapa de todos os estados do funil na rota / ───────────────────
      // Inclui os steps do quiz (1-8) e os estados pós-quiz (video, email, etc.)
      var STEPS = [
        { label: 'Gênero',       match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 1; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.currentStep = 1; } },
        { label: 'Mês',          match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 2; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.genderValue = vm.genderValue || 'feminino'; vm.userSex = vm.userSex || 'feminino'; vm.currentStep = 2; } },
        { label: 'Dia',          match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 3; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.genderValue = vm.genderValue || 'feminino'; vm.userSex = vm.userSex || 'feminino'; vm.monthValue = vm.monthValue || { name:'Janeiro', number:'01', numerology:1, animationText:'0+1' }; vm.currentStep = 3; } },
        { label: 'Década',       match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 4; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.monthValue = vm.monthValue || { name:'Janeiro', number:'01', numerology:1, animationText:'0+1' }; vm.dayValue = vm.dayValue || '15'; vm.currentStep = 4; } },
        { label: 'Ano',          match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 5; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.decadeValue = vm.decadeValue || 1990; vm.currentStep = 5; if (typeof vm.generatorYears === 'function') vm.generatorYears(); } },
        { label: 'Estado Civil', match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 6; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.yearValue = vm.yearValue || 1995; vm.currentStep = 6; } },
        { label: 'Desafio',      match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 7; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.civilStatusValue = vm.civilStatusValue || 'solteiro'; vm.currentStep = 7; } },
        { label: 'Nome',         match: function(vm) { return vm.section1 && Math.floor(vm.currentStep) === 8; }, set: function(vm) { resetStates(vm); vm.section1 = true; vm.desafioValue = vm.desafioValue || 'amor'; vm.currentStep = 8; } },
        { label: 'Video 1',      match: function(vm) { return vm.backgroundVSL && !vm.parte2 && !vm.parte3 && !vm.parte4 && !vm.parte5; }, set: function(vm) { resetStates(vm); vm.backgroundVSL = true; vm.section1 = false; vm.loadingBlock = false; vm.numeroDestinoOficial = vm.numeroDestinoOficial || 1; } },
        { label: 'Email',        match: function(vm) { return vm.parte2; }, set: function(vm) { resetStates(vm); vm.parte2 = true; vm.showEmailPopup = true; vm.backgroundVSL = false; vm.section1 = false; } },
        { label: 'Loading',      match: function(vm) { return vm.parte3 && !vm.parte4 && !vm.parte5; }, set: function(vm) { resetStates(vm); vm.parte3 = true; vm.section1 = false; } },
        { label: 'Pitch',        match: function(vm) { return vm.parte4; }, set: function(vm) { resetStates(vm); vm.parte4 = true; vm.section1 = false; } },
        { label: 'VSL Final',    match: function(vm) { return vm.parte5 && !vm.cta; }, set: function(vm) { resetStates(vm); vm.parte5 = true; vm.cta = false; vm.section1 = false; } },
        { label: 'Botao Compra', match: function(vm) { return vm.parte5 && vm.cta; }, set: function(vm) { resetStates(vm); vm.parte5 = true; vm.cta = true; vm.section1 = false; } },
      ];

      function resetStates(vm) {
        vm.section1 = false;
        vm.loadingBlock = false;
        vm.backgroundVSL = false;
        vm.parte2 = false;
        vm.showEmailPopup = false;
        vm.parte3 = false;
        vm.parte4 = false;
        vm.parte5 = false;
        vm.cta = false;
      }

      // Rotas do funil (páginas diferentes) — ordem real de navegação
      var ROUTES = [
        { label: 'Quiz',          path: '/' },
        { label: 'VSL',           path: '/v2' },
        { label: 'Envio Dados',   path: '/enviodosdados' },
        { label: 'Gerar Ass.',    path: '/g-ass' },
        { label: 'Assinatura',    path: '/assinatura-poder' },
        { label: 'Obrigado',      path: '/obrigado-correio' },
      ];

      function getVm() {
        var el = document.getElementById('app');
        if (!el) return null;
        var root = el.__vue__;
        if (!root) return null;
        // O componente do funil fica em $children[0] na rota /
        var child = root.$children && root.$children[0];
        // Verifica se tem currentStep (é o componente do quiz)
        if (child && typeof child.currentStep !== 'undefined') return child;
        // Fallback: busca recursivo em $children
        function find(vm) {
          if (!vm) return null;
          if (typeof vm.currentStep !== 'undefined') return vm;
          for (var i = 0; i < (vm.$children || []).length; i++) {
            var found = find(vm.$children[i]);
            if (found) return found;
          }
          return null;
        }
        return find(root);
      }

      function currentRoute() {
        var p = location.pathname;
        for (var i = 0; i < ROUTES.length; i++) {
          if (ROUTES[i].path === p) return i;
        }
        return -1;
      }

      function currentStepIndex() {
        var vm = getVm();
        if (!vm) return -1;
        for (var i = 0; i < STEPS.length; i++) {
          if (STEPS[i].match(vm)) return i;
        }
        return -1;
      }

      function isQuizRoute() {
        return location.pathname === '/';
      }

      function updateLabel() {
        var lbl = document.getElementById('dev-label');
        var info = document.getElementById('dev-step-info');
        if (!lbl) return;
        var ri = currentRoute();
        if (!isQuizRoute() || ri > 0) {
          lbl.textContent = ri >= 0 ? ROUTES[ri].label : location.pathname;
          if (info) info.textContent = '';
        } else {
          var vm = getVm();
          var si = currentStepIndex();
          lbl.textContent = si >= 0 ? STEPS[si].label : location.pathname;
          if (info) info.textContent = si >= 0 ? (si + 1) + '/' + STEPS.length : '';
        }
        // botões
        var btnP = document.getElementById('dev-prev');
        var btnN = document.getElementById('dev-next');
        if (!btnP || !btnN) return;
        if (isQuizRoute()) {
          var si2 = currentStepIndex();
          btnP.disabled = si2 <= 0;
          btnN.disabled = si2 < 0;
        } else {
          var ri2 = currentRoute();
          btnP.disabled = ri2 <= 0;
          btnN.disabled = ri2 >= ROUTES.length - 1 || ri2 < 0;
        }
      }

      function advance(delta) {
        if (isQuizRoute()) {
          var vm = getVm();
          if (!vm) { alert('Vue ainda não montou. Aguarde a página carregar.'); return; }
          var si = currentStepIndex() + delta;
          if (si < 0) si = 0;
          if (si >= STEPS.length) { location.href = ROUTES[1].path; return; }
          STEPS[si].set(vm);
          setTimeout(updateLabel, 80);
        } else {
          var ri = currentRoute() + delta;
          if (ri < 0) ri = 0;
          if (ri >= ROUTES.length) ri = ROUTES.length - 1;
          location.href = ROUTES[ri].path;
        }
      }

      function buildBar() {
        if (document.getElementById('dev-nav-bar')) return;

        var style = document.createElement('style');
        style.textContent = '#dev-nav-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(8,8,8,.96);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:40px;padding:8px 18px;z-index:2147483647;font-family:ui-monospace,monospace;font-size:12px;color:#e0e0e0;box-shadow:0 4px 32px rgba(0,0,0,.7);user-select:none;white-space:nowrap;}' +
          '#dev-nav-bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1;padding:0;flex-shrink:0;transition:background .15s;}' +
          '#dev-nav-bar button:hover:not(:disabled){background:rgba(255,255,255,.28);}' +
          '#dev-nav-bar button:disabled{opacity:.2;cursor:not-allowed;}' +
          '#dev-label{min-width:110px;text-align:center;color:#fbbf24;font-weight:700;}' +
          '#dev-step-info{color:rgba(255,255,255,.4);font-size:10px;}' +
          '#dev-badge{background:#fbbf24;color:#000;font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;letter-spacing:.08em;flex-shrink:0;}';
        document.head.appendChild(style);

        var bar = document.createElement('div');
        bar.id = 'dev-nav-bar';
        bar.innerHTML =
          '<span id="dev-badge">DEV</span>' +
          '<button id="dev-prev" title="Anterior">&#8592;</button>' +
          '<span id="dev-label">...</span>' +
          '<span id="dev-step-info"></span>' +
          '<button id="dev-next" title="Próximo">&#8594;</button>';
        document.body.appendChild(bar);

        document.getElementById('dev-prev').addEventListener('click', function(e) { e.stopPropagation(); advance(-1); });
        document.getElementById('dev-next').addEventListener('click', function(e) { e.stopPropagation(); advance(1); });

        // Atualiza label periodicamente para pegar mudanças de step do Vue
        setInterval(updateLabel, 300);

        // Atualiza em mudanças de rota
        var _push = history.pushState.bind(history);
        history.pushState = function() { _push.apply(history, arguments); setTimeout(updateLabel, 100); };
        var _replace = history.replaceState.bind(history);
        history.replaceState = function() { _replace.apply(history, arguments); setTimeout(updateLabel, 100); };
        window.addEventListener('popstate', function() { setTimeout(updateLabel, 100); });
      }

      // Aguarda DOM e tenta montar
      if (document.body) { buildBar(); } else { document.addEventListener('DOMContentLoaded', buildBar); }
    })();
  </script>
